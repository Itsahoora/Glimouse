name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build cursor companion
        run: dotnet build .\native\GestureMouse.CursorCompanion\GestureMouse.CursorCompanion.csproj --configuration Release

      - name: Test native command state
        run: dotnet run --project .\native\GestureMouse.CommandState.Tests\GestureMouse.CommandState.Tests.csproj --configuration Release

      - name: Publish Windows app
        run: dotnet publish .\native\GestureMouse.TrayHost\GestureMouse.TrayHost.csproj -c Release -r win-x64 --self-contained false

      - name: Upload Windows app folder
        uses: actions/upload-artifact@v4
        with:
          name: Glimouse-windows-x64
          path: native/GestureMouse.TrayHost/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
