name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build cursor companion
        run: dotnet build .\native\GestureMouse.CursorCompanion\GestureMouse.CursorCompanion.csproj --configuration Release

      - name: Test native command state
        run: dotnet run --project .\native\GestureMouse.CommandState.Tests\GestureMouse.CommandState.Tests.csproj --configuration Release

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish .\native\GestureMouse.TrayHost\GestureMouse.TrayHost.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true

      - name: Package Windows app and license
        shell: pwsh
        run: |
          $publishDirectory = "native\GestureMouse.TrayHost\bin\Release\net10.0-windows\win-x64\publish"
          $packageDirectory = "release-package"
          $archivePath = "Glimouse-$env:GITHUB_REF_NAME-win-x64.zip"

          New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null
          Copy-Item "$publishDirectory\*" $packageDirectory -Recurse -Force
          Copy-Item "LICENSE" "$packageDirectory\LICENSE"
          Compress-Archive -Path "$packageDirectory\*" -DestinationPath $archivePath

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $archivePath = "Glimouse-$env:GITHUB_REF_NAME-win-x64.zip"
          gh release create $env:GITHUB_REF_NAME $archivePath `
            --title "Glimouse $env:GITHUB_REF_NAME" `
            --generate-notes
